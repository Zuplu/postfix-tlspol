server:
  username: ""
  chroot: ""
  do-daemonize: no
  use-syslog: no
  verbosity: 1
  logfile: ""
  log-servfail: yes
  ede: yes
  interface: 127.0.0.1
  port: 8053
  do-not-query-localhost: yes
  do-ip4: yes
  prefer-ip4: yes
  do-ip6: yes
  prefer-ip6: no
  do-udp: yes
  do-tcp: yes
  udp-connect: yes
  max-udp-size: 1232
  edns-buffer-size: 1232
  auto-trust-anchor-file: /var/lib/unbound/trusted-key.key
  msg-cache-size: 16m
  rrset-cache-size: 32m
  cache-min-ttl: 10
  cache-max-ttl: 240
  cache-max-negative-ttl: 240
  # Preserve authoritative reply TTLs while the resolver cache still expires at cache-max-ttl.
  serve-original-ttl: yes
  serve-expired: no
  prefetch-key: yes
  prefetch: yes
  hide-identity: yes
  hide-version: yes
  hide-trustanchor: yes
  target-fetch-policy: "3 2 1 0 0"
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-algo-downgrade: no
  harden-below-nxdomain: yes
  harden-referral-path: no
  harden-large-queries: no
  harden-short-bufsize: yes
  harden-unverified-glue: no
  harden-unknown-additional: no
  aggressive-nsec: yes
  val-clean-additional: yes
  val-permissive-mode: no
  unknown-server-time-limit: 376
  jostle-timeout: 200
  discard-timeout: 1900
  so-reuseport: yes
  num-threads: 2
  qname-minimisation: yes
  minimal-responses: yes
  infra-cache-min-rtt: 50
  infra-keep-probing: yes
  module-config: "validator iterator"
remote-control:
  control-enable: no
