name: Go and release checks

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - vendor/**
      - VERSION
      - cliff.toml
      - .github/**
      - scripts/**
      - deployments/**
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TLSPOL_LIVE_TESTS: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting and vendored dependencies
        run: |
          test -z "$(gofmt -l main.go internal)"
          go mod tidy
          go mod vendor
          git diff --exit-code -- go.mod go.sum vendor
          test -z "$(git ls-files --others --exclude-standard -- vendor)"
      - name: Check Go packages and race safety
        run: |
          go vet -mod=vendor -tags netgo ./...
          go test -mod=vendor -race -count=1 -tags netgo ./...
          CGO_ENABLED=0 go build -mod=vendor -tags netgo -o "$RUNNER_TEMP/postfix-tlspol" .
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe
        with:
          tool: git-cliff@2.14.2
          fallback: none
      - name: Check release preparation and workflows
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          GOBIN="$RUNNER_TEMP/workflow-tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/workflow-tools/actionlint"
