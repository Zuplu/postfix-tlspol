# SPDX-License-Identifier: Apache-2.0

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: auto, patch, minor, major, or an exact version such as 1.15.0
        type: string
        default: auto
        required: true
      publish:
        description: Commit the version and changelog, tag, push Docker images, and publish the release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check:
    if: github.server_url == 'https://github.com' && github.repository == 'Zuplu/postfix-tlspol' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/go-test.yaml

  platforms:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003
      - name: Require every release platform before changing main or creating a tag
        run: python3 .github/scripts/release.py docker-platforms

  prepare:
    needs: [check, platforms]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: git-cliff@2.14.2
          fallback: none
      - name: Prepare version and prepend changelog
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          args=()
          if [ "$RELEASE_PUBLISH" = true ]; then args+=(--record); fi
          python3 .github/scripts/release.py prepare "$RELEASE_VERSION" \
            --output "$RUNNER_TEMP/release" "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-source
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
      - name: Reserve the tag and create a draft release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py draft "$RUNNER_TEMP/release/prepared-release.json"
      - name: Summarize preparation
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.prepare.outputs.commit }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: |
          {
            printf 'Prepared **%s** from %s. Publish: %s.\n\n' "$RELEASE_TAG" "$RELEASE_COMMIT" "$RELEASE_PUBLISH"
            cat "$RUNNER_TEMP/release/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    needs: prepare
    uses: ./.github/workflows/build-docker.yaml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      source_ref: ${{ needs.prepare.outputs.commit }}
      version: ${{ needs.prepare.outputs.version }}
      prepared: true
      publish: ${{ inputs.publish }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish:
    if: inputs.publish
    needs: [prepare, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-source
          path: ${{ runner.temp }}/release/
      - name: Publish the release after Docker succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          python3 .github/scripts/release.py publish \
            "$RUNNER_TEMP/release/prepared-release.json" --digest "$IMAGE_DIGEST"
